name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Version embedded in the archive used by installer checks
        type: string
        default: development
    outputs:
      release-artifact-id:
        description: The release archive validated by the installer matrix
        value: ${{ jobs.package-release.outputs.artifact-id }}
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Automatic PR checks are limited to branches in this repository.
  # Keep GitHub's fork approval policy set to all external contributors too:
  # fork PRs can modify this workflow, including these job conditions.
  secrets:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Scan complete Git history for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Download and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          cd "$RUNNER_TEMP"
          awk -v archive="$archive" '$2 == archive { print }' gitleaks-checksums.txt > gitleaks-selected.sha256
          test -s gitleaks-selected.sha256
          sha256sum --check gitleaks-selected.sha256
          tar -xzf "$archive" gitleaks
      - name: Scan all history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .'

  quality:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Quality, Tests, and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Report Bun runtime
        run: |
          bun --version
          bun --revision

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod

      - name: Install dependencies
        id: dependencies
        run: bun ci

      - name: Prove frozen lockfile stability
        run: git diff --exit-code -- bun.lock

      - name: Check production package hygiene
        run: bun run package:hygiene

      - name: Upload package hygiene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-hygiene-${{ matrix.os }}-${{ github.job }}
          if-no-files-found: error
          path: .scratch/ci/package-hygiene/

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run lint

      - name: Build application
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run build

      - name: Generate backend test evidence
        id: backend-evidence
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run --cwd backend test:evidence

      - name: Upload backend test evidence
        if: always() && (steps.backend-evidence.outcome == 'success' || steps.backend-evidence.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence-${{ matrix.os }}
          if-no-files-found: error
          path: |
            .scratch/ci/backend/backend-junit-merged.xml
            .scratch/ci/backend/backend-test-timings.json
            .scratch/ci/backend/backend-test-output.txt
            .scratch/ci/backend/backend-coverage-summary.md
            .scratch/ci/backend/coverage/lcov.info

      - name: Generate frontend coverage evidence
        id: frontend-evidence
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run --cwd frontend test:coverage

      - name: Upload frontend coverage evidence
        if: always() && (steps.frontend-evidence.outcome == 'success' || steps.frontend-evidence.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.os }}
          if-no-files-found: error
          path: |
            .scratch/ci/frontend/frontend-coverage-summary.md
            .scratch/ci/frontend/coverage/coverage-summary.json
            .scratch/ci/frontend/coverage/lcov.info

  package-release:
    name: Package release assets
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache: false
      # The shared setup-go cache is saved by whichever Linux job finishes first,
      # without the macOS and arm64 builds this job needs. Keep its own cache,
      # warmed on main by warm-caches.yml. Releases always build cold.
      - name: Restore release build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            backend-go/bin/.cache
          key: release-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum', 'scripts/pdfium.ts') }}-${{ hashFiles('backend-go/**/*.go') }}
          restore-keys: release-build-${{ runner.os }}-${{ hashFiles('backend-go/go.sum', 'scripts/pdfium.ts') }}-
      - name: Require the project license before packaging
        run: test -s LICENSE
      - name: Package source release and checksum
        run: bun run package:release --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release-version || 'development' }}
      - name: Upload release assets
        id: release-artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          path: dist/release/

  installer:
    name: Installation and upgrade (${{ matrix.os }})
    needs: package-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Download the release under test
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.package-release.outputs.artifact-id }}
          path: ${{ runner.temp }}/release
      - name: Verify clean local installation and upgrade
        run: bun run test:installer
        env:
          INSTALLER_TEST_RELEASE_DIR: ${{ runner.temp }}/release

  backend-worker-benchmark:
    name: Backend worker benchmark (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.workflow == 'CI')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod
      - run: bun ci
      - name: Build document processor
        run: bun run build:go
      - name: Measure backend Bun worker caps
        shell: bash
        run: bun run --cwd backend benchmark:test-parallel | tee backend-test-parallel-${{ matrix.os }}.md

      - name: Upload backend worker-cap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-parallel-${{ matrix.os }}
          path: backend-test-parallel-${{ matrix.os }}.md

  go-processing:
    name: Go document processing
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod
      - run: bun ci
      - name: Verify Go formatting
        run: test -z "$(gofmt -l backend-go)"
      - name: Go race checks and processing integration
        run: bun run test:go

  backend-flake:
    name: Backend randomized repetition lane
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.workflow == 'CI')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Prove frozen lockfile stability
        run: git diff --exit-code -- bun.lock

      - name: Check production package hygiene
        run: bun run package:hygiene

      - name: Upload package hygiene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-hygiene-ubuntu-24.04-${{ github.job }}
          if-no-files-found: error
          path: .scratch/ci/package-hygiene/

      - name: Build document processor
        run: bun run build:go

      - name: Run randomized repeated backend tests
        run: bun run --cwd backend test:bun:flake

      - name: Upload backend flake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-flake-ubuntu-24.04
          if-no-files-found: error
          path: .scratch/ci/backend/backend-flake.md

  browser-journey:
    name: Built SPA Chromium journey
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Prove frozen lockfile stability
        run: git diff --exit-code -- bun.lock

      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run isolated browser journey
        run: bun run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-extraction-journey-ubuntu-24.04
          if-no-files-found: error
          path: .scratch/ci/playwright/
