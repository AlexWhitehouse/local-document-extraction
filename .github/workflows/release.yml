name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      release-version: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}

  publish:
    name: Publish validated release
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download the validated release
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.validate.outputs.release-artifact-id }}
          path: dist/release/
      - name: Verify the release checksum
        working-directory: dist/release
        run: sha256sum --check document-extraction.tar.gz.sha256
      - name: Publish validated tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=()
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" dist/release/install.sh dist/release/document-extraction.tar.gz dist/release/document-extraction.tar.gz.sha256 --verify-tag --generate-notes "${notes[@]}"
