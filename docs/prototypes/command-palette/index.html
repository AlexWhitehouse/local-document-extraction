<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command palette prototype</title>
<style>
  /* ---------- Reviewer chrome (follows the host theme; fallbacks when opened directly) ---------- */
  body { background: var(--background, #0d1014); color: var(--foreground, #e6e9ee); margin: 0; }
  .proto { --fg: var(--foreground, #e6e9ee); --mf: var(--muted-foreground, #98a2b0); --bd: var(--border, #2a3240); --acc: var(--accent, #19c1b4); --rad: var(--radius, 8px);
    color: var(--fg); font-family: var(--font-sans, system-ui, sans-serif); max-width: 1400px; margin: 0 auto; }
  .switcher { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
  .switcher button { text-align: left; padding: 8px 10px; border-radius: var(--rad); cursor: pointer; border: 1px solid var(--bd); background: transparent; color: var(--fg); font: inherit; line-height: 1.25; }
  .switcher button b { display: block; font-size: 13px; }
  .switcher button span { display: block; font-size: 11.5px; color: var(--mf); margin-top: 2px; }
  .switcher button[aria-selected="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .brief { font-size: 13px; line-height: 1.45; margin: 0 0 8px; }
  .tries { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--mf); }
  .tries button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer; border: 1px solid var(--bd); background: transparent; color: var(--fg); text-align: left; }
  .tries button:hover { border-color: var(--acc); }
  .tries .follow { border-style: dashed; }
  .tradeoffs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; font-size: 12.5px; line-height: 1.45; }
  .tradeoffs div { border: 1px solid var(--bd); border-radius: var(--rad); padding: 10px 12px; }
  .tradeoffs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mf); }
  .tradeoffs ul { margin: 0; padding-left: 16px; }
  .frame { background: #04060a; border-radius: var(--rad); padding: 16px; }

  /* ---------- Studio tokens ---------- */
  .app {
    --pane-main: #070a0f; --pane-nav: #080b11; --pane-context: #090d13; --pane-raised: #0a0f16;
    --pane-elevated: #101722; --pane-overlay: #151f2c; --pane-active: #1a2636; --field-bg: #0b1018; --row-hover: #0d131c;
    --rule: #19212d; --rule-strong: #283346; --rule-dashed: #32425b;
    --text-0: #f3f7ff; --text-1: #c2cfdf; --text-2: #91a0b7; --text-3: #67778f; --text-label: #a0aec1;
    --ac: #19c1b4; --ac-fill: #14a397;
    --ok-fg: #19c1b4; --ok-bg: rgba(25,193,180,.12); --ok-sub: rgba(25,193,180,.06); --ok-bd: rgba(25,193,180,.45); --ok-tx: #9df4eb;
    --in-fg: #4fa6ff; --in-bg: rgba(79,166,255,.12); --in-bd: rgba(79,166,255,.45); --in-tx: #a9d2ff;
    --wa-fg: #f4b84f; --wa-bg: rgba(244,184,79,.12); --wa-bd: rgba(244,184,79,.45); --wa-tx: #ffdca1;
    --da-fg: #ff6f8f; --da-bg: rgba(255,111,143,.12); --da-bd: rgba(255,111,143,.45); --da-tx: #ffadc2;
    --ne-fg: #91a0b7; --ne-bg: rgba(159,176,199,.12); --ne-bd: rgba(159,176,199,.45);
    /* Proposed new token family for query pills (one per part of speech). */
    --tk-action-bg: rgba(25,193,180,.16); --tk-action-bd: rgba(25,193,180,.55); --tk-action-fg: #9df4eb;
    --tk-qty-bg: rgba(159,176,199,.14); --tk-qty-bd: rgba(159,176,199,.5); --tk-qty-fg: #dbe4f0;
    --tk-subject-bg: rgba(148,163,255,.14); --tk-subject-bd: rgba(148,163,255,.5); --tk-subject-fg: #c9d0ff;
    --tk-field-bg: rgba(79,166,255,.15); --tk-field-bd: rgba(79,166,255,.55); --tk-field-fg: #a9d2ff;
    --tk-cond-bg: rgba(244,184,79,.15); --tk-cond-bd: rgba(244,184,79,.55); --tk-cond-fg: #ffdca1;
    --tk-time-bg: rgba(206,140,255,.14); --tk-time-bd: rgba(206,140,255,.5); --tk-time-fg: #e8c8ff;
    --tk-status-bg: rgba(255,111,143,.14); --tk-status-bd: rgba(255,111,143,.5); --tk-status-fg: #ffc2d1;
    --tk-instr-bg: rgba(255,255,255,.04); --tk-instr-bd: #3a4a63; --tk-instr-fg: #d6deea;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: dark; position: relative; height: 700px; overflow: hidden; border: 1px solid var(--rule-strong); border-radius: 6px;
    background: var(--pane-main); color: var(--text-0); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 190px 250px minmax(0, 1fr);
  }
  .app *, .app *::before, .app *::after { box-sizing: border-box; }
  .app button { font: inherit; color: inherit; }
  .app :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .app mark { background: rgba(244,184,79,.22); color: var(--wa-tx); border-radius: 2px; padding: 0 1px; }

  /* Background app */
  .nav { background: var(--pane-nav); border-right: 1px solid var(--rule); padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav .brand { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .nav .brand b { display: block; font: 700 15px/1.3 system-ui, sans-serif; color: var(--text-0); letter-spacing: 0; text-transform: none; margin-bottom: 10px; }
  .searchbtn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; margin-bottom: 10px; border: 1px solid var(--rule-strong); border-radius: 3px; background: var(--field-bg); color: var(--text-3); cursor: pointer; font-size: 12.5px; text-align: left; }
  .searchbtn:hover { border-color: var(--text-3); color: var(--text-2); }
  .searchbtn kbd { margin-left: auto; }
  .navitem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 3px; color: var(--text-2); font-size: 13px; border-left: 2px solid transparent; }
  .navitem.on { color: var(--text-0); background: var(--ok-sub); border-left-color: var(--ac); }
  .ctx { background: var(--pane-context); border-right: 1px solid var(--rule); padding: 14px; }
  .ctx h2 { font-size: 15px; margin: 0 0 10px; }
  .ghost-row { height: 40px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .ghost-row i { display: block; height: 7px; border-radius: 2px; background: var(--pane-overlay); width: 70%; }
  .ghost-row i + i { width: 45%; opacity: .6; }
  .bgmain { padding: 18px 22px; }
  .bgmain .crumb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .bgmain h1 { font-size: 19px; font-weight: 500; margin: 4px 0 4px; }
  .bgmain p { color: var(--text-2); margin: 0 0 16px; font-size: 12.5px; }
  .bgcard { border: 1px solid var(--rule); border-radius: 4px; height: 120px; margin-bottom: 12px; background: var(--pane-raised); }

  /* Scrim and palette shell */
  .scrim { position: absolute; inset: 0; background: rgba(2,4,8,.72); z-index: 40; }
  .pal { position: absolute; left: 50%; transform: translateX(-50%); z-index: 41; width: min(640px, calc(100% - 32px)); top: 60px;
    background: var(--pane-elevated); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 24px 64px rgba(0,0,0,.65); display: flex; flex-direction: column; max-height: calc(100% - 100px); overflow: hidden; }
  .pal.b { width: min(940px, calc(100% - 32px)); top: 44px; height: calc(100% - 88px); }
  .pal.c { width: min(720px, calc(100% - 32px)); top: 32px; height: calc(100% - 64px); }
  .pal.d { width: min(680px, calc(100% - 32px)); }
  @media (prefers-reduced-motion: no-preference) { .pal.anim { animation: palin .14s ease-out; } }
  @keyframes palin { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.985); } }

  .pbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); min-height: 52px; }
  .pbar .ico { color: var(--text-3); flex: none; }
  .pin { flex: 1; min-width: 0; border: 0; background: none; color: var(--text-0); font: inherit; font-size: 15px; height: 30px; }
  .pin:focus { outline: none; }
  .pin::placeholder { color: var(--text-3); }
  kbd { font-family: var(--mono); font-size: 10px; color: var(--text-2); border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; line-height: 15px; background: var(--pane-raised); white-space: nowrap; }
  .crumbp { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--tk-action-bg); border: 1px solid var(--tk-action-bd); color: var(--tk-action-fg); font-size: 12.5px; white-space: nowrap; flex: none; }
  .crumbp.sub { background: var(--tk-subject-bg); border-color: var(--tk-subject-bd); color: var(--tk-subject-fg); }

  /* Query pills */
  .chunks { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 4px; font-size: 15px; line-height: 26px; cursor: text; padding: 2px 0; }
  .chunks:focus { outline: none; }
  .chunks .plain { color: var(--text-2); }
  .tk { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 5px; border: 1px solid; font-size: 14px; white-space: nowrap; position: relative; overflow: hidden; }
  .tk .res { font-family: var(--mono); font-size: 10px; opacity: .85; padding-left: 6px; border-left: 1px solid currentColor; line-height: 14px; }
  .tk-action { background: var(--tk-action-bg); border-color: var(--tk-action-bd); color: var(--tk-action-fg); font-weight: 600; }
  .tk-quantity { background: var(--tk-qty-bg); border-color: var(--tk-qty-bd); color: var(--tk-qty-fg); }
  .tk-subject, .tk-template, .tk-page, .tk-workspace { background: var(--tk-subject-bg); border-color: var(--tk-subject-bd); color: var(--tk-subject-fg); }
  .tk-field { background: var(--tk-field-bg); border-color: var(--tk-field-bd); color: var(--tk-field-fg); }
  .tk-cond, .tk-value { background: var(--tk-cond-bg); border-color: var(--tk-cond-bd); color: var(--tk-cond-fg); }
  .tk-time { background: var(--tk-time-bg); border-color: var(--tk-time-bd); color: var(--tk-time-fg); }
  .tk-status { background: var(--tk-status-bg); border-color: var(--tk-status-bd); color: var(--tk-status-fg); }
  .tk-person, .tk-role, .tk-format { background: var(--tk-qty-bg); border-color: var(--tk-qty-bd); color: var(--tk-qty-fg); }
  .tk-instruction { background: var(--tk-instr-bg); border-color: var(--tk-instr-bd); border-style: dashed; color: var(--tk-instr-fg); white-space: normal; height: auto; min-height: 26px; line-height: 1.35; padding: 3px 8px; }
  .tk.unk { background: none; border: 1px dashed var(--rule-dashed); color: var(--text-2); }
  .tk.pending::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.14) 50%, transparent 80%); background-size: 220% 100%; animation: shimmer 1s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @media (prefers-reduced-motion: no-preference) { .tk.pop { animation: pop .22s ease-out both; } }
  @keyframes pop { from { opacity: 0; transform: translateY(3px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { .tk.pending::after, .skel { animation: none !important; } }

  /* Body, groups and rows */
  .pbody { flex: 1; overflow: auto; min-height: 0; padding: 6px; }
  .pgrp { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 10px 10px 4px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; color: var(--text-1); min-height: 36px; }
  .row.hi { background: var(--pane-active); color: var(--text-0); }
  .row .ri { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; background: var(--pane-overlay); color: var(--text-2); flex: none; }
  .row .ri.act { background: var(--tk-action-bg); color: var(--tk-action-fg); }
  .row .ri.ask { background: linear-gradient(135deg, rgba(25,193,180,.25), rgba(148,163,255,.25)); color: var(--text-0); }
  .row .rt { min-width: 0; flex: 1; }
  .row .rt strong { display: block; font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rt span { display: block; font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rk { margin-left: auto; font-size: 11px; color: var(--text-3); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .row.danger .rt strong { color: var(--da-tx); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .t-success { background: var(--ok-fg); } .t-danger { background: var(--da-fg); } .t-info { background: var(--in-fg); } .t-warning { background: var(--wa-fg); } .t-neutral { background: var(--ne-fg); }
  .pfoot { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 11px; color: var(--text-3); flex-wrap: wrap; }
  .pfoot .sp { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .legend .tk { height: 18px; font-size: 10.5px; padding: 0 5px; border-radius: 3px; }

  /* Shared UI */
  .btn { height: 28px; padding: 0 11px; border-radius: 3px; border: 1px solid var(--rule-strong); background: var(--pane-raised); cursor: pointer; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--text-3); }
  .btn.primary { background: var(--ac-fill); border-color: var(--ac-fill); color: #03110f; font-weight: 600; }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.danger { background: var(--da-bg); border-color: var(--da-bd); color: var(--da-tx); font-weight: 600; }
  .btn.text { background: none; border: 0; padding: 0; height: auto; color: var(--ac); }
  .btn kbd { margin-left: 2px; }
  .input, .select, .ta { width: 100%; background: var(--field-bg); color: var(--text-0); border: 1px solid var(--rule-strong); border-radius: 3px; font: inherit; font-size: 13px; }
  .input, .select { height: 30px; padding: 0 9px; }
  .ta { padding: 8px 9px; resize: none; line-height: 1.45; }
  .input:focus, .select:focus, .ta:focus { outline: none; border-color: var(--ac); }
  .input::placeholder, .ta::placeholder { color: var(--text-3); }
  .lbl { display: block; font-size: 11px; color: var(--text-label); margin: 0 0 4px; }
  .seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 3px; overflow: hidden; }
  .seg button { height: 28px; padding: 0 11px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--rule-strong); }
  .seg button[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok-tx); }
  .badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 2px; font-size: 10.5px; border: 1px solid var(--ne-bd); background: var(--ne-bg); color: var(--text-1); white-space: nowrap; }
  .badge.warning { color: var(--wa-tx); border-color: var(--wa-bd); background: var(--wa-bg); }
  .badge.success { color: var(--ok-tx); border-color: var(--ok-bd); background: var(--ok-bg); }
  .badge.danger { color: var(--da-tx); border-color: var(--da-bd); background: var(--da-bg); }
  .callout { border: 1px solid var(--wa-bd); background: var(--wa-bg); color: var(--wa-tx); border-radius: 4px; padding: 7px 10px; font-size: 12px; margin: 6px 4px; display: flex; gap: 8px; align-items: baseline; }
  .callout.info { border-color: var(--in-bd); background: var(--in-bg); color: var(--in-tx); }
  .callout .btn.text { margin-left: auto; font-size: 11.5px; }
  .hint { font-size: 11.5px; color: var(--text-3); line-height: 1.45; }
  .skel { height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--pane-overlay), var(--pane-active), var(--pane-overlay)); background-size: 200% 100%; animation: sk 1.1s linear infinite; margin: 10px 10px 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  .thinking { padding: 14px 14px 18px; color: var(--text-2); font-size: 12.5px; }
  .summary { padding: 8px 10px 4px; font-size: 12px; color: var(--text-2); display: flex; justify-content: space-between; gap: 10px; }
  .summary b { color: var(--text-0); font-weight: 600; }
  .bulk { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-top: 1px solid var(--rule); background: var(--pane-raised); }

  /* Flows */
  .flow { padding: 12px 14px 14px; }
  .fhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .fhead h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .fhead .sub { color: var(--text-2); font-size: 12px; }
  .fstack > * + * { margin-top: 10px; }
  .factions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .factions .left { margin-right: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 999px; cursor: pointer; border: 1px solid var(--rule-strong); background: transparent; color: var(--text-1); text-align: left; }
  .chip:hover { border-color: var(--ac); color: var(--text-0); }
  .card { border: 1px solid var(--rule-strong); border-radius: 5px; background: var(--pane-raised); }
  .gcard { border: 1px solid var(--rule-strong); border-radius: 5px; padding: 10px 12px; background: var(--pane-raised); }
  .gcard.sel { border-color: var(--ok-bd); background: var(--ok-sub); }
  .gcard + .gcard { margin-top: 8px; }
  .gcard label.gh { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .gcard input { accent-color: var(--ac); margin-top: 3px; }
  .gcard strong { font-weight: 600; font-size: 13px; }
  .gtags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  table.diff { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .diff td { padding: 5px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
  .diff .op { width: 18px; font-family: var(--mono); font-weight: 700; }
  .diff .add .op { color: var(--ok-fg); } .diff .remove .op { color: var(--da-fg); } .diff .change .op { color: var(--wa-fg); }
  .diff .remove td:not(.op) { color: var(--text-3); text-decoration: line-through; }
  .diff .typ { font-family: var(--mono); font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .explain { font-size: 13px; line-height: 1.5; color: var(--text-1); margin: 0; }
  .drop { border: 1px dashed var(--rule-dashed); border-radius: 6px; padding: 18px; text-align: center; color: var(--text-2); font-size: 12.5px; }
  .filelist .row { cursor: default; min-height: 30px; padding: 4px 8px; }
  .danger-box { border: 1px solid var(--da-bd); background: var(--da-bg); border-radius: 5px; padding: 12px; }
  .danger-box h3 { margin: 0 0 4px; font-size: 14px; color: var(--da-tx); }
  .checkrow { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 4px; font-size: 12.5px; color: var(--text-1); cursor: pointer; }
  .checkrow:hover { background: var(--row-hover); }
  .checkrow input { accent-color: var(--ac); }
  .checkrow .rk { margin-left: auto; font-size: 11px; color: var(--text-3); text-align: right; }

  /* Variant B: split */
  .split { flex: 1; display: grid; grid-template-columns: minmax(250px, 38%) 1fr; min-height: 0; }
  .split > .pbody { border-right: 1px solid var(--rule); }
  .preview { overflow: auto; min-height: 0; padding: 14px 16px; }
  .preview .flow { padding: 0; }
  .preview h3 { margin: 0 0 2px; font-size: 15px; font-weight: 500; }
  .preview .meta { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
  table.fields { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fields th { text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 500; padding: 6px; border-bottom: 1px solid var(--rule-strong); }
  .fields td { padding: 6px; border-bottom: 1px solid var(--rule); }
  .fields tr.match td { background: var(--ok-sub); }
  .fields tr.match td:first-child { box-shadow: inset 2px 0 0 var(--ac); }
  .fields .v { font-family: var(--mono); font-size: 12px; }
  .missing { color: var(--text-3); font-style: italic; font-family: system-ui, sans-serif !important; }
  .invalid { color: var(--wa-tx); font-family: system-ui, sans-serif !important; }
  .readas { padding: 10px; border: 1px solid var(--rule); border-radius: 5px; background: var(--pane-raised); margin-bottom: 8px; }
  .readas .chunks { font-size: 13px; }
  .readas .tk { height: 22px; font-size: 12.5px; }
  .steps { list-style: none; margin: 0; padding: 6px; }

const S = { variant: "a", open: true, q: "", view: "edit", phase: "idle", segs: [], it: null, results: null, hi: 0, flow: null, thread: [], toasts: [], page: "documents", ws: "hnh", menu: null, typing: false, popped: false, openDoc: null };

function chunksHtml(segs, pending, { pop = false } = {}) {
  let k = 0;

    if (s.type === "plain") {
      return s.text.split(/(\s+)/).map((w) => {
        if (!w) return ""; if (!w.trim()) return " ";

        if (s.resolved?.includes(w)) return `<span class="tk tk-value" title="Value: matched by meaning">${esc(w)}</span>`;
        if (!pending && s.ignored?.includes(word)) return `<span class="tk unk" title="Not used">${esc(w)}</span>`;
        return `<span class="plain">${esc(w)}</span>`;
      }).join("");
    }
    const delay = pop ? ` style="animation-delay:${k++ * 45}ms"` : "";
    return `<span class="tk tk-${s.type}${pending ? " pending" : ""}${pop ? " pop" : ""}" title="${TK_LABEL[s.type]}${s.res ? `: ${esc(s.res)}` : ""}"${delay}>${esc(s.text)}${!pending && s.res ? `<span class="res">${esc(s.res)}</span>` : ""}</span>`;

}
function legendHtml(segs) {

  return types.length ? `<span class="legend">${types.map((t) => `<span class="tk tk-${t}">${TK_LABEL[t]}</span>`).join("")}</span>` : "";

function docItem(d, c) {

  return { kind: "doc", id: d.id, labelHtml: esc(d.name), subHtml: `${d.tpl ? TPL[d.tpl].name : "No template"} · ${sl} · ${fmtDay(d.up)}${match}`, icon: `<span class="dot t-${tone}" aria-hidden="true"></span>`, right: "Open" };

const actItem = (k) => ({ kind: "action", id: k, label: ACTIONS[k].label, sub: k === "retry" ? plural(DOCS.filter((d) => d.status === "failed").length, "failed document") : ACTIONS[k].hint, icon: I.bolt, iconCls: "act", danger: ACTIONS[k].danger });

function localItems(q) {

  if (!l) {

  }
  const words = l.split(/\s+/); const has = (t) => words.every((w) => t.toLowerCase().includes(w));
  Object.keys(ACTIONS).forEach((k) => { if (has(ACTIONS[k].label + " " + ACTIONS[k].kw)) add("Actions", actItem(k)); });
  Object.keys(TPL).forEach((t) => { if (has(TPL[t].name + " template")) add("Templates", tplItem(t)); });
  DOCS.filter((d) => has(d.name + " " + (d.f?.invoice_number?.v || ""))).slice(0, 4).forEach((d) => add("Documents", docItem(d)));
  PAGES.forEach(([id, label]) => { if (has(label + " go to page")) add("Go to", { kind: "page", id, label, sub: "Page", icon: I.page }); });

  const ask = { group: "Ask", kind: "ask", id: "ask", label: q.trim(), sub: "Search and run actions in plain language", icon: I.spark, iconCls: "ask", right: `<kbd>⌘↵</kbd>` };

function rowsHtml(items, offset = 0) {

      <span class="ri ${it.iconCls || ""}">${it.icon || ""}</span><span class="rt"><strong>${it.labelHtml || esc(it.label)}</strong>${it.subHtml || it.sub ? `<span>${it.subHtml || esc(it.sub)}</span>` : ""}</span>${it.right ? `<span class="rk">${it.right}</span>` : ""}</button>`;

// =====================================================================
// 6. Enter: chunk instantly, then interpret
// =====================================================================
function submit(text = S.q) {
  const q = text.trim(); if (!q) return;
  S.menu = null; S.flow = null; S.segs = lex(q); S.view = "chunked"; S.phase = "thinking"; S.hi = 0; S.popped = true;
  const prevTurn = S.variant === "c" ? [...S.thread].reverse().find((t) => t.it?.action === "find") : null;
  let turn = null;
  if (S.variant === "c") { turn = { q, segs: S.segs, phase: "thinking" }; S.thread.push(turn); S.q = ""; }
  render(); S.popped = false;
  const segs = S.segs;
  setTimeout(() => {
    if (S.segs !== segs && !turn) return;
    const it = interpret(segs, { prev: prevTurn?.it });
    if (it.followUp && prevTurn && it.action !== "find") it.targets = prevTurn.results;
    S.it = it; S.phase = "done"; S.results = it.action === "find" ? findDocs(it) : null;
    const q0 = segs.find((s) => s.type === "quantity"); if (q0 && S.results) q0.res = `${S.results.length} found`;
    if (turn) { turn.phase = "done"; turn.it = it; turn.results = S.results; }
    if (!["find", "find_templates"].includes(it.action)) { startFlow(it.action, it, it.followUp ? findDocs(it) : null); if (turn) turn.flow = S.flow; }
    render();
  }, 750);
}
function runItem(item) {
  if (!item) return submit();
  if (item.kind === "ask") return submit();
  if (item.kind === "example") return typeAndRun(item.id);
  if (item.kind === "action") { startFlow(item.id); if (S.variant === "c" && S.flow) S.thread.push({ q: item.label, segs: [{ type: "action", text: item.label.replace("…", "") }], phase: "done", flow: S.flow }); return render(); }
  if (item.kind === "doc") { S.openDoc = DOCS.find((d) => d.id === item.id).name; return navigate("documents"); }
  if (item.kind === "tpl") return navigate("templates");
  if (item.kind === "page") return navigate(item.id);
  if (item.kind === "ws") return switchWs(item.id);
  if (item.kind === "pick-tpl") { S.flow.tpl = item.id; S.flow.step = "describe"; S.q = ""; return render(); }
  if (item.kind === "pick-ws") return switchWs(item.id);
}
let typingRun = 0;

  render(); let i = 0;

    if (run !== typingRun) return;
    if (i < text.length) { i = Math.min(text.length, i + 2); S.q = text.slice(0, i); if (S.variant === "d") liveUpdate(); render(); setTimeout(tick, 18); return; }
    S.typing = false;

    if (S.variant === "d") { render(); if (S.it && (S.it.unknown.length || !["find", "find_templates"].includes(S.it.action))) setTimeout(() => run === typingRun && dEnter(), 450); } else setTimeout(() => run === typingRun && submit(), 150);
  };

}

const VARIANTS = {

    brief: "A single centred palette. Typing gives instant matches for actions, documents, templates and pages. Enter turns the sentence into pills inside the box: Action, Quantity, Subject, Field and Condition. The pills shimmer while the request is read, then each one shows what it matched. Actions carry on inside the palette. Edit template proposes changes you review and save there.",

function renderChrome() {

const app = document.getElementById("app");

function resetAll() { typingRun++; Object.assign(S, { anim: true, open: true, q: "", view: "edit", phase: "idle", segs: [], it: null, results: null, hi: 0, flow: null, thread: [], menu: null, openDoc: null, typing: false }); }

// =====================================================================
// 9. Events
// =====================================================================
document.addEventListener("click", (e) => {
  const vb = e.target.closest("[data-variant]");
  if (vb) { S.variant = vb.dataset.variant; resetAll(); render(); return; }
  const tb = e.target.closest("[data-try]");

  const act = el.dataset.act, f = S.flow;
  if (el.tagName === "LABEL" || (el.tagName === "INPUT" && el.type === "checkbox")) return;
  if (S.menu && act !== "menu-pick" && act !== "slot") S.menu = null;
  switch (act) {
    case "open-pal": S.open = true; S.anim = true; break;
    case "close-pal": closePalette(); break;
    case "item": { const items = S.variant === "d" && S.it?.action === "find" && !S.flow ? (S.results || []).map((d) => docItem(d)) : currentItems(); S.hi = +el.dataset.i; runItem(items[+el.dataset.i]); return; }
    case "open-doc": S.openDoc = DOCS.find((d) => d.id === el.dataset.v).name; navigate("documents"); return;
    case "nav": navigate(el.dataset.v); return;
    case "try-ex": if (S.variant !== "c") resetAll(); typeAndRun(el.dataset.v); return;
    case "start-action": S.view = "edit"; S.segs = []; S.it = null; startFlow(el.dataset.v); if (S.variant === "c" && S.flow) S.thread.push({ q: ACTIONS[el.dataset.v].label, segs: [{ type: "action", text: ACTIONS[el.dataset.v].label.replace("…", "") }], phase: "done", flow: S.flow }); break;
    case "start-find": startFlow("find"); break;
    case "edit-this": S.view = "edit"; S.segs = []; startFlow("edit_template", { tpl: el.dataset.v, crit: emptyCrit() }); break;
    case "new-thread": S.thread = []; S.flow = null; break;
    case "flow-cancel": markDone("Cancelled"); S.flow = null; break;
    case "flow-back": f.step = "describe"; break;
    case "instr-chip": f.instruction = el.dataset.v; break;
    case "propose": if (f.instruction.trim()) runThinking(f); return;
    case "open-editor": markDone("Opened in the editor"); finish(`Changes applied to the ${TPL[f.tpl].name} draft`, "templates"); return;
    case "save-template": { const T = TPL[f.tpl]; T.version += 1; markDone(`Saved as v${T.version}`); finish(`Template “${T.name}” saved as v${T.version}`); return; }
    case "create-template": { const name = app.querySelector('[data-in="tname"]')?.value || f.proposal.name; markDone("Created"); finish(`Template “${name}” created`, "templates"); return; }
    case "add-files": f.files.push({ name: "invoice-hnh-20601.pdf", size: "412 KB" }, { name: "receipt-fuel-1008.jpg", size: "1.2 MB" }, { name: "scan_0051.png", size: "880 KB" }); break;
    case "rm-file": f.files.splice(+el.dataset.v, 1); break;
    case "do-upload": markDone("Uploaded"); finish(`${plural(f.files.length, "document")} queued`); return;
    case "do-retry": markDone("Queued again"); finish(`${plural(f.checked.size, "document")} queued again`); return;
    case "fmt": f.fmt = el.dataset.v; break;
    case "do-export": markDone("Exported"); finish(`Exported ${plural(f.targets.length, "document")} as ${f.fmt === "excel" ? "Excel" : f.fmt.toUpperCase()}`); return;
    case "do-delete": markDone("Deleted"); finish(`Deleted ${plural(f.targets.length, "document")}`); return;
    case "role": f.role = el.dataset.v; break;
    case "do-invite": markDone("Invitation sent"); finish(`Invitation sent to ${f.email}`); return;

    case "menu-pick": { const opt = menuOptions(S.menu.id)[+el.dataset.i]; opt[1](S.it); S.menu = null; S.q = sentence(S.it); liveUpdate(); break; }

function markDone(text) { if (S.variant === "c") { const t = S.thread.find((x) => x.flow && x.flow === S.flow); if (t && !t.doneText) t.doneText = text; } }

    }

  }

    const items = S.variant === "d" ? (S.flow ? flowItems(S.flow) : S.it?.action === "find" ? (S.results || []).map((d) => docItem(d)) : []) : S.variant === "c" && !S.flow ? (S.q ? localItems(S.q).slice(0, 6) : []) : currentItems();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.hi = Math.max(0, Math.min(items.length - 1, S.hi + (e.key === "ArrowDown" ? 1 : -1))); S.keyed = true; render(); return; }

  }
